[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edistribucion-client"
version = "1.0.0"
description = "HTTP-only client to read your e-distribucion electricity consumption (unofficial)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Juan Antonio Cano Salado" }]
keywords = ["edistribucion", "endesa", "electricity", "consumption"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jacano/edistribucion-client"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
edistribucion = "edistribucion:main"

[tool.setuptools]
py-modules = ["edistribucion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
